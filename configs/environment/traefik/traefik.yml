global:
  checkNewVersion: true
  sendAnonymousUsage: false

log:
  level: INFO

accessLog:
  # Send logs to the journal rather than an unbounded persistent file.
  format: common
  filters:
    statusCodes:
      - "200-299"
      - "400-599"

certificatesResolvers:
  lets-encrypt-dns:
    acme:
      email: joshua.hoogstraat@icloud.com
      storage: /opt/traefik/acme.json
      dnsChallenge:
        provider: acme-dns
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"

entryPoints:
  tunnel:
    address: :8080
    http:
      aliasHeadersStrategy: delete
  https:
    address: :443
    asDefault: true
    http:
      middlewares: [lan-only@file]
      aliasHeadersStrategy: delete
      tls:
        certResolver: lets-encrypt-dns
        domains:
          - main: hoogstraat.de
            sans:
              - "*.hoogstraat.de"

providers:
  providersThrottleDuration: 2s
  docker:
    endpoint: "tcp://socket-proxy:2375"
    network: homelab
    defaultRule: 'Host(`{{ index .Labels "subdomain" | default .ContainerName }}.hoogstraat.de`)'
    exposedByDefault: false

  file:
    filename: /etc/traefik/public-routes.yml
