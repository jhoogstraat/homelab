# Cloudflare must send vault., trek., depanator., brain. and kitchen.hoogstraat.net to http://traefik:8080.
# This entrypoint has no published host port and exposes only these applications.
http:
  routers:
    public-brain:
      rule: Host(`brain.hoogstraat.net`)
      entryPoints: [tunnel]
      service: second-brain
      middlewares: [tunnel-https]
    public-depanator:
      rule: Host(`depanator.hoogstraat.net`)
      entryPoints: [tunnel]
      service: depanator
      middlewares: [tunnel-https]
    public-kitchen:
      rule: Host(`kitchen.hoogstraat.net`)
      entryPoints: [tunnel]
      service: kitchen
      middlewares: [tunnel-https]
    public-trek:
      rule: Host(`trek.hoogstraat.net`)
      entryPoints: [tunnel]
      service: trek
      middlewares: [tunnel-https]
    public-vault:
      rule: Host(`vault.hoogstraat.net`)
      entryPoints: [tunnel]
      service: vault
      middlewares: [tunnel-https]
    public-vault-admin:
      rule: Host(`vault.hoogstraat.net`) && PathRegexp(`(?i)^/+admin`)
      priority: 100
      entryPoints: [tunnel]
      service: noop@internal
      middlewares: [deny-public-admin]
  middlewares:
    tunnel-https:
      headers:
        customRequestHeaders:
          X-Forwarded-Proto: https
    security-headers:
      headers:
        contentTypeNosniff: true
        referrerPolicy: strict-origin-when-cross-origin
        stsSeconds: 31536000
    tunnel-only:
      ipAllowList:
        sourceRange: [10.92.0.9/32]
    lan-only:
      ipAllowList:
        sourceRange: [192.168.0.0/24, 127.0.0.1/32, '::1/128', 'fe80::/10']
    deny-public-admin:
      ipAllowList:
        sourceRange: [127.0.0.1/32, '::1/128']
  services:
    second-brain:
      loadBalancer:
        servers:
          - url: http://second-brain:8000
    depanator:
      loadBalancer:
        servers:
          - url: http://depanator:8080
    kitchen:
      loadBalancer:
        servers:
          - url: http://kitchen:8000
    trek:
      loadBalancer:
        servers:
          - url: http://trek:3000
    vault:
      loadBalancer:
        servers:
          - url: http://vaultwarden:80
