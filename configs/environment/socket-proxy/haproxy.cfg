global
    log stdout format raw local0
    maxconn 64

defaults
    mode http
    log global
    timeout connect 5s
    timeout client 1h
    timeout server 1h

# Only discovery and monitoring endpoints. In particular, deny exec, archive,
# logs, image operations, native Libpod routes, and every mutating method.
frontend podman_read_api
    bind :2375
    acl read_method method GET HEAD
    acl ping path_reg ^(/v[0-9]+\.[0-9]+)?/_ping$
    acl get_method method GET
    acl read_path path_reg ^(/v[0-9]+\.[0-9]+)?/(version|info|events|containers/json|containers/[a-zA-Z0-9_.-]+/(json|stats))$
    http-request deny unless read_method
    http-request deny unless ping or get_method read_path
    default_backend podman

backend podman
    server socket /var/run/podman.sock
