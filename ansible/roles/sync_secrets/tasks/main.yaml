# Bitwarden lookups currently require `BW_SESSION` being set, because `bw status` does not respect `--session`.
# Ansibles `environment` field does not apply to lookups, so `BW_SESSION` must be available before running the playbook.
# See: https://github.com/ansible-collections/community.general/issues/8690
#
# Note: The Bitwarden lookup below requires vaultwarden to be running, which creates a bootstrap problem.
# Currently, the age key is provided via vars_prompt in the containers playbook instead.

- name: Decrypt and copy secrets
  block:
    - name: Ensure secrets parent directory exists
      ansible.builtin.file:
        path: "{{ secrets_target_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Create temporary directory for copying secrets
      ansible.builtin.tempfile:
        state: directory
        path: "{{ secrets_target_path | dirname }}"
        prefix: ".{{ secrets_target_path | basename }}."
        suffix: ".new"
      register: tmp_secrets_dir

    - name: Secure temporary secrets directory
      ansible.builtin.file:
        path: "{{ tmp_secrets_dir.path }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Decrypt and copy to tmp dir
      ansible.builtin.copy:
        content: "{{ lookup('community.sops.sops', item, age_key=age_private_key) }}"
        dest: "{{ tmp_secrets_dir.path }}/{{ item | basename | regex_replace('\\.enc', '') }}"
        owner: root
        group: root
        mode: '0600'
      loop: "{{ lookup('fileglob', secrets_local_path, wantlist=True) }}"

    - name: Prepare previous secrets backup path
      ansible.builtin.set_fact:
        previous_secrets_path: "{{ tmp_secrets_dir.path }}.previous"

    - name: Check existing secrets directory
      ansible.builtin.stat:
        path: "{{ secrets_target_path }}"
      register: existing_secrets_dir

    - name: Move existing secrets directory aside
      ansible.builtin.command:
        argv:
          - mv
          - -T
          - "{{ secrets_target_path }}"
          - "{{ previous_secrets_path }}"
      when: existing_secrets_dir.stat.exists

    - name: Move new secrets directory into place
      block:
        - name: Rename staged secrets directory
          ansible.builtin.command:
            argv:
              - mv
              - -T
              - "{{ tmp_secrets_dir.path }}"
              - "{{ secrets_target_path }}"

      rescue:
        - name: Restore previous secrets directory after failed replacement
          ansible.builtin.command:
            argv:
              - mv
              - -T
              - "{{ previous_secrets_path }}"
              - "{{ secrets_target_path }}"
          when: existing_secrets_dir.stat.exists

        - name: Fail secret replacement
          ansible.builtin.fail:
            msg: "Failed to replace secrets directory; previous contents were restored when present."

    - name: Remove previous secrets backup
      ansible.builtin.file:
        path: "{{ previous_secrets_path }}"
        state: absent

  always:
    - name: Cleanup tmp secrets directory
      ansible.builtin.file:
        path: "{{ tmp_secrets_dir.path }}"
        state: absent
      when: tmp_secrets_dir.path is defined
