name: Image security
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
  pull_request:
    paths:
      - quadlets/**
      - scripts/scan-images
      - .github/workflows/image-security.yaml
permissions:
  contents: read
  actions: read  # find the last published host image build (scan baseline)
jobs:
  scan:
    # Scanning only reads registry metadata and layers, so any runner works;
    # scripts/scan-images selects the host's ARM64 variant explicitly.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Scan Quadlet images
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # Weekly and manual runs also flag deployed images whose CRITICAL findings have a fix.
        run: python3 scripts/scan-images ${{ github.event_name != 'pull_request' && '--fail-on-fixable' || '' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: image-security
          path: image-security.json
