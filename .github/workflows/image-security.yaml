name: Application image security
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'
  pull_request:
    paths:
      - quadlets/**
      - scripts/scan-images
      - .github/workflows/image-security.yaml
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Scan pinned ARM64 application images
        run: |
          status=0
          sudo --preserve-env=GITHUB_STEP_SUMMARY python3 scripts/scan-images || status=$?
          cat image-security.json
          exit "$status"
