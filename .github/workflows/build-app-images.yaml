name: Build patched application images
on:
  push:
    branches: [main]
    paths: [images/**, .github/workflows/build-app-images.yaml]
permissions:
  contents: read
  packages: write
jobs:
  apps:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "apps=$(ls images/*/Containerfile | cut -d/ -f2 | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
  build:
    needs: apps
    # Native ARM64 builds; emulating ARM64 on x64 runners is many times slower.
    runs-on: ubuntu-26.04-arm
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.apps.outputs.apps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman
      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$GHCR_TOKEN" | sudo podman login --authfile /tmp/registry-auth.json ghcr.io --username "$REGISTRY_USER" --password-stdin
      - name: Build and publish ARM64 image
        env:
          APP_NAME: ${{ matrix.app }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${REPOSITORY}:${APP_NAME}-sha-${COMMIT_SHA}"
          sudo podman build --arch arm64 --format docker -f "images/${APP_NAME}/Containerfile" --label "org.opencontainers.image.source=https://github.com/${REPOSITORY}" -t "$image" .
          sudo sh images/verify.sh "$APP_NAME" "$image"
          sudo podman push --authfile /tmp/registry-auth.json "$image"
      - name: Remove registry credentials
        if: always()
        run: sudo rm -f /tmp/registry-auth.json
  pin:
    # Point the Quadlets at the images just published and merge once the host build and image scan pass.
    # RENOVATE_TOKEN, because pushes and PRs made with GITHUB_TOKEN don't trigger CI.
    needs: build
    runs-on: ubuntu-latest
    concurrency: pin-patched-images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          token: ${{ secrets.RENOVATE_TOKEN }}
      - name: Open and merge the pin PR
        env:
          GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          for app in $(ls images/*/Containerfile | cut -d/ -f2); do
            image="ghcr.io/${REPOSITORY}:${app}-sha-${COMMIT_SHA}"
            digest=$(docker buildx imagetools inspect "$image" --format '{{.Manifest.Digest}}')
            sed -i -E "s#ghcr\.io/${REPOSITORY}:${app}-sha-[0-9a-f]+@sha256:[0-9a-f]+#${image}@${digest}#" quadlets/*.container
          done
          git diff --quiet && exit 0
          branch="pin-patched-images-${COMMIT_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -qam "chore: pin patched application images from ${COMMIT_SHA::7}"
          git push -f origin "$branch"
          gh pr create --base main --head "$branch" --title "chore: pin patched application images from ${COMMIT_SHA::7}" \
            --body "Pins the images published by ${GITHUB_SERVER_URL}/${REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Merged automatically once CI passes."
          sleep 60  # let the PR's checks register
          gh pr checks "$branch" --watch --fail-fast
          gh pr merge "$branch" --squash --delete-branch
