name: Renovate
on:
  workflow_dispatch:
  schedule:
    # UTC, evening: GitHub starts runs scheduled around midnight UTC up to hours late.
    # Merges and their builds then finish well before the Pi's 04:00 Berlin update.
    # Three runs because each merges at most two PRs.
    - cron: '17 18,20,22 * * *'
permissions:
  contents: read
concurrency: renovate
jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: renovatebot/github-action@1c0cf989c02653fba0efe7ca5772338860ca71dc # v46.3.12
        with:
          # A PAT, not github.token: PRs opened with github.token don't trigger CI, so nothing could automerge.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: 'false'
