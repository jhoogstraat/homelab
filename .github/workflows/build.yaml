name: Build bootc Image
on:
  workflow_dispatch:
  schedule:
    # Saturday rebuild picks up Fedora updates (dnf upgrade) for Sunday's update-host.
    - cron: '17 4 * * 6'
  push:
    branches:
      - main
    paths:
      - Containerfile
      - .containerignore
      - configs/**
      - quadlets/**
      - users/**
      - scripts/**
      - systemd/**
      - secrets/*.enc.env
      - tests/**
      - .github/workflows/build.yaml
      - .github/workflows/image-security.yaml
  pull_request:
    paths:
      - Containerfile
      - .containerignore
      - configs/**
      - quadlets/**
      - users/**
      - scripts/**
      - systemd/**
      - secrets/*.enc.env
      - tests/**
      - .github/workflows/build.yaml
      - .github/workflows/image-security.yaml

jobs:
  build-and-push:
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
      packages: write
      actions: read  # scan baseline: the last published host image build

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Podman
        run: sudo apt-get update && sudo apt-get install -y podman python3 restic rsync

      - name: Verify initialization and maintenance
        run: sudo python3 -m unittest discover -s tests -v

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: printf '%s' "$GITHUB_TOKEN" | sudo podman login --authfile /tmp/homelab-registry-auth.json ghcr.io --username "$REGISTRY_USER" --password-stdin

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build image
        run: |
          sudo podman build \
            --arch arm64 \
            --format docker \
            --tag homelab-bootc:build \
            --file ./Containerfile \
            .

      - name: Validate packaged Quadlets and systemd dependencies
        run: sudo python3 tests/verify_image.py homelab-bootc:build

      - name: Verify restricted Podman API
        run: sudo python3 tests/verify_proxy.py homelab-bootc:build

      - name: Verify public tunnel routes
        run: sudo python3 tests/verify_routes.py homelab-bootc:build

      - name: Scan application digests before publication
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: sudo --preserve-env=GITHUB_STEP_SUMMARY,GH_TOKEN,GH_REPO python3 scripts/scan-images

      - name: Push image tags
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            sudo podman tag homelab-bootc:build "$tag"
            sudo podman push --authfile /tmp/homelab-registry-auth.json "$tag"
          done <<< "$IMAGE_TAGS"

      - name: Remove registry credentials
        if: always()
        run: sudo rm -f /tmp/homelab-registry-auth.json
